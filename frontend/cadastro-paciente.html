<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Cadastro de Paciente</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="assets/styles.css">
</head>

<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
  <div class="container-fluid">
    
        <a class="navbar-brand" href="index.html">DoseCerta</a>

    <button class="btn btn-light me-3" onclick="history.back()">
      ⬅ Voltar
    </button>
  </div>
</nav>

<div class="container">
  <div class="card p-4">
    <h2>Cadastro de Paciente</h2>

    <form onsubmit="cadastrarPaciente(event)">
      <div class="row">
        <div class="col-md-6">
          <label>Nome</label>
          <input class="form-control" name="nome" required>
        </div>

        <div class="col-md-6">
          <label>CPF</label>
          <input class="form-control" name="cpf" required>
        </div>
      </div>

      <label class="mt-3">Data de Nascimento</label>
      <input type="date" class="form-control" name="data_nascimento" required>

      <label class="mt-3">Gênero</label>
      <input name="genero" class="form-control">

      <label class="mt-3">Telefone</label>
      <input name="telefone" class="form-control">

      <label class="mt-3">Email</label>
      <input name="email" type="email" class="form-control" required>

      <label class="mt-3">Senha</label>
      <input type="password" name="senha" class="form-control" required>

      <label class="mt-3">Histórico Familiar</label>
      <textarea name="historico_familiar" class="form-control" rows="3"></textarea>

      <button class="btn btn-primary mt-4">Cadastrar</button>
    </form>

    <pre id="resultado"></pre>
  </div>
</div>

<script src="assets/script.js"></script>
</body>
</html>
