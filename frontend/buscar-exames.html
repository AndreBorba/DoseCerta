<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Buscar Exames</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="assets/styles.css">
</head>

<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
  <div class="container-fluid">
    
    <a class="navbar-brand" href="index.html">DoseCerta</a>

    <button class="btn btn-light me-3" onclick="history.back()">
      ⬅ Voltar
    </button>
  </div>
</nav>

<div class="container">
  <div class="card p-4">
    <h2>Buscar Exames do Paciente</h2>

    <form onsubmit="buscarExames(event)">
      <label>CPF</label>
      <input id="cpf-exame" class="form-control" required>

      <button class="btn btn-primary mt-3">Buscar</button>
    </form>

    <table class="table mt-4">
      <thead>
        <tr>
          <th>Protocolo</th>
          <th>Tipo</th>
          <th>Data</th>
          <th>Laboratório</th>
        </tr>
      </thead>
      <tbody id="tabelaExames"></tbody>
    </table>
  </div>
</div>

<script src="assets/script.js"></script>
</body>
</html>
