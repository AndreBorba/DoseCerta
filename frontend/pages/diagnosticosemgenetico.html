<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Buscar Pacientes por Doença</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
  <div class="container-fluid">
    <a class="navbar-brand" href="../index.html">DoseCerta</a>
    <button class="btn btn-light me-3" onclick="history.back()">⬅ Voltar</button>
  </div>
</nav>

<div class="container mt-4">
  <div class="card p-4">
    <h2>Buscar Pacientes que possuem Diagnóstico de uma Doença, mas que não possuem Exame Genético desse Diagnóstico</h2>

    <form onsubmit="buscarDiagnosticoSemGenetico(event)">
      <label for="cid">Selecione a Doença (CID):</label>
      <select id="cid" class="form-select mb-3"></select>
      <button class="btn btn-primary">Buscar</button>
    </form>

    <table class="table mt-4">
      <thead>
        <tr>
          <th>Nome</th>
          <th>Telefone</th>
          <th>Diagnóstico</th>
        </tr>
      </thead>
      <tbody id="tabelaResultados"></tbody>
    </table>
  </div>
</div>

<script src="../scripts/diagnosticosemgenetico.js"></script>
</body>
</html>
