<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Buscar Paciente</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="../assets/styles.css">
</head>

<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
  <div class="container-fluid">
    <a class="navbar-brand" href="../index.html">DoseCerta</a>
    <button class="btn btn-light me-3" onclick="history.back()">⬅ Voltar</button>
  </div>
</nav>

<div class="container">
  <div class="card p-4">
    <h2>Consultar Pacientes em Tratamento por um Medico</h2>

    <form onsubmit="buscarPaciente(event)">
      <label>Buscar por Nome ou CPF</label>
      <input id="termo" class="form-control" required>
      <button class="btn btn-primary mt-3">Buscar</button>
    </form>

    <table class="table mt-4">
      <thead>
        <tr>
          <th>Nome Medico</th>
          <th>Nome Paciente</th>
          <th>ID Paciente</th>
          <th>Telefone</th>
          <th>Data Inicio</th>
          <th>Data Fim</th>
        </tr>
      </thead>
      <tbody id="tabelaResultados"></tbody>
    </table>
  </div>
</div>

<script src="../scripts/buscapaciente.js"></script>
</body>
</html>
