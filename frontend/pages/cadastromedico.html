<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Cadastro de Médico</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
  <div class="container-fluid">
    <a class="navbar-brand" href="../index.html">DoseCerta</a>
    <button class="btn btn-light me-3" onclick="history.back()">⬅ Voltar</button>
  </div>
</nav>

<div class="container">
  <div class="card p-4">
    <h2>Cadastro de Médicos</h2>

    <form id="formMedico" onsubmit="cadastrarMedico(event)">
      <div class="form-check mb-3">
        <input type="checkbox" class="form-check-input" id="jaPaciente" onchange="toggleCamposPaciente()">
        <label class="form-check-label" for="jaPaciente">Já é paciente</label>
      </div>

      <label>CPF (formato: XXX.XXX.XXX-XX)</label>
      <input class="form-control mb-3" name="cpf" required onblur="verificaPaciente()">

      <div id="dadosPessoa">
        <label>Nome</label>
        <input class="form-control mb-3" name="nome" required>

        <label>Data de Nascimento</label>
        <input type="date" class="form-control mb-3" name="data_nascimento" required>

        <label>Gênero</label>
        <select name="genero" class="form-control mb-3">
          <option value="">-- Selecione --</option>
          <option value="F">FEMININO</option>
          <option value="M">MASCULINO</option>
        </select>

        <label>Telefone</label>
        <input name="telefone" class="form-control mb-3">

        <label>E-mail</label>
        <input name="email" type="email" class="form-control mb-3" required>

        <label>Senha</label>
        <input type="password" name="senha" class="form-control mb-3" required>
      </div>

      <label>CRM</label>
      <input name="crm" class="form-control mb-3" required>

      <label>Especialização</label>
      <input name="especializacao" class="form-control mb-3">

      <label>Local de Trabalho</label>
      <input name="local" class="form-control mb-3">

      <button class="btn btn-primary mt-3">Cadastrar</button>
    </form>

    <pre id="resultado"></pre>
  </div>
</div>

<script src="../scripts/cadastromedico.js"></script>
</body>
</html>
