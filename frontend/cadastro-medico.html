<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Cadastro de Médico</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="assets/styles.css">
</head>

<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
  <div class="container-fluid">
    
        <a class="navbar-brand" href="index.html">DoseCerta</a>

    <button class="btn btn-light me-3" onclick="history.back()">
      ⬅ Voltar
    </button>
  </div>
</nav>

<div class="container">
  <div class="card p-4">
    <h2>Cadastro de Médico</h2>

    <form onsubmit="cadastrarMedico(event)">
      <label>Nome</label>
      <input class="form-control" name="nome" required>

      <label class="mt-3">CPF</label>
      <input class="form-control" name="cpf" required>

      <label class="mt-3">CRM</label>
      <input class="form-control" name="crm" required>

      <label class="mt-3">Especialização</label>
      <input class="form-control" name="especializacao">

      <label class="mt-3">Email</label>
      <input class="form-control" name="email" type="email" required>

      <label class="mt-3">Senha</label>
      <input class="form-control" type="password" name="senha" required>

      <button class="btn btn-primary mt-4">Cadastrar</button>
    </form>

    <pre id="resultado"></pre>
  </div>
</div>

<script src="assets/script.js"></script>
</body>
</html>
